<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"></head>
<body>
  <h1>チップをクリックするだけで、まとめて表示 ON/OFF</h1>
  <p class="lead">サイドバーのチェックボックスを 1 つずつ触る必要はもうありません。</p>
  <div class="stage">
    <div class="col" style="flex:0 0 480px">
      <img class="shot" src="../../docs/images/chip-bar.png" alt="" style="width:480px">
      <ul class="points">
        <li>青塗り: グループの全カレンダーを表示中</li>
        <li>淡い青: 一部のカレンダーだけ表示中</li>
        <li>白: すべて非表示 / グレー: 対象なし</li>
      </ul>
    </div>
    <img class="shot" src="../../docs/images/hero.png" alt="" style="flex:1;min-width:0">
  </div>
</body></html>
